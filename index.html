<script>
/* The site moved to its own address. Browsers keep saved scores per address,
   so this page forwards the ones saved here in the URL fragment, which is
   never sent to any server; the app merges them (best score wins) and clears
   the fragment. The route (#/u/5 etc.) comes along too. */
(function () {
  var to = "https://tajweed-companion.web.app/";
  var route = location.hash.replace(/^#/, ""), saved = null;
  try { saved = localStorage.getItem("tajweed-companion-v1"); } catch (e) {}
  var frag = saved && saved !== "{}"
    ? "#carry=" + encodeURIComponent(saved) + (route ? "&to=" + encodeURIComponent(route) : "")
    : (route ? "#" + route : "");
  location.replace(to + frag);
})();
</script>
